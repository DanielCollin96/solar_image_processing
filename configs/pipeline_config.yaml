# =============================================================================
# Solar Image Processing Pipeline Configuration
# =============================================================================

# Base directory (project root)
# Set to null to auto-detect as the parent of this config file's directory
base_dir: null

# Data Paths (relative to base_dir)
paths:
  # --- Historical pipeline ---
  # Directory where unprocessed solar image files are stored after download.
  unprocessed: data/unprocessed_images/SDO
  # Root directory for preprocessed image files (full-disk 1024x1024)
  preprocessed: data/preprocessed_images/uncropped
  # Root directory for full-disk cropped image files (224x224 patches)
  cropped: data/preprocessed_images/proswin

  # --- Real-time pipeline ---
  unprocessed_realtime: data/unprocessed_images_realtime/SDO
  preprocessed_realtime: data/preprocessed_images_realtime/uncropped
  cropped_realtime: data/preprocessed_images_realtime/proswin

  # Calibration data
  instrument_data: data/instrument_data

# Date range
start_date: "2026-03-01 00:00:00"
end_date:   "2026-07-29 23:00:00"

# Channels to process (AIA only, no HMI)
channels:
  - aia_171
  - aia_193
  - aia_211

# Multi-email parallel download workers.
# For now there's just one worker covering all three AIA channels.
# Add more workers later if you re-introduce the second JSOC email.
download_workers:
  - email: chaurasia@uni-potsdam.de
    channels:
      - aia_171
      - aia_193
      - aia_211

# Options for downloading
download:
  # Email registered with JSOC for export requests
  email: chaurasia@uni-potsdam.de
  # Factor by which the JSOC server rebins images before they are downloaded.
  #   rebin_factor: 1   -> full resolution, 4096x4096 pixels
  #   rebin_factor: 4   -> 1024x1024 pixels
  rebin_factor: 4
  # JSOC data series identifier for AIA
  jsoc_series:
    aia:
      series: AIA.lev1_euv_12s
      segment: image

# Options for preprocessing
preprocessing:
  use_gpu: false
  differential_rotation: true
  target_rsun_arcsec: 976.0
  load_preprocessing_fails: false
  overwrite_existing: false

# Options for cropping
cropping:
  downsample_resolution: 512
  crop_mode: square
  crop_pixels: 300
  resize_cropped: 224
